<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>Oxygen · Popover</title>
<link rel="stylesheet" href="_base.css?v=4"><link rel="stylesheet" href="_components.css?v=12">
<style>body{padding:3.2rem;max-width:112rem;font-family:Roboto,sans-serif}h1{font:700 2.8rem/1.2 Montserrat,sans-serif;color:#192634;margin:0 0 .6rem}h2{font-size:1.2rem;text-transform:uppercase;letter-spacing:.04em;color:#4B739B;margin:0 0 1.4rem;font-weight:600;padding-bottom:.6rem;border-bottom:0.1rem solid #E4EDF6}.lede{color:#3A5978;font-size:1.4rem;line-height:1.5;margin:0 0 3rem;max-width:72rem}.section{margin-bottom:4rem;display:flex;flex-direction:column;gap:1.6rem}.spec{font-family:'Roboto Mono',monospace;font-size:1.1rem;border-collapse:collapse;color:#3A5978}.spec td{padding:.4rem 2rem .4rem 0;vertical-align:top}.spec td:first-child{color:#6B91B8}</style></head><body><h1>Popover</h1><p class="lede">Floating surface anchored to a trigger, for short content and actions.</p><div class="section"><h2>Trigger + popover</h2>
<div style="position:relative;padding:6rem 2rem;background:#F7FAFE;border-radius:1.2rem;border:0.1rem solid #E4EDF6">
<button class="ox-button ox-button--variant-outlined ox-button--ui-neutral ox-button--size-medium" style="position:relative"><span class="ox-button__innerWrapper"><span class="ox-button__hoverEffect"></span><span class="ox-button__activeEffect"></span><span class="ox-button__contentWrapper">Choose color ▾</span></span></button>
<div style="position:absolute;top:14rem;left:2rem;width:28rem;background:#fff;border-radius:1rem;box-shadow:0 .8rem 2.4rem rgba(0,0,0,.16),0 0 0 .1rem #E4EDF6;padding:1.6rem;z-index:10">
<div style="font:600 1.3rem/1 Roboto;color:#192634;margin-bottom:1rem">Pick a color</div>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:.6rem"><div style="aspect-ratio:1;background:#2351CC;border-radius:.4rem;cursor:pointer;box-shadow:0 0 0 .2rem white,0 0 0 .4rem #2351CC"></div><div style="aspect-ratio:1;background:#16A34A;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#F59E0B;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#DB3B21;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#7C3AED;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#0891B2;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#DB2777;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#475569;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#64748B;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#1E293B;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#FCD34D;border-radius:.4rem;cursor:pointer;"></div><div style="aspect-ratio:1;background:#EC4899;border-radius:.4rem;cursor:pointer;"></div></div>
<div style="position:absolute;top:-.6rem;left:2rem;width:1.2rem;height:1.2rem;background:#fff;transform:rotate(45deg);box-shadow:-.1rem -.1rem 0 #E4EDF6"></div>
</div>
</div></div>
<div class="section"><h2>Specs</h2><table class="spec"><tr><td>Shadow</td><td>elevation-l · 0 .8rem 2.4rem rgba(0,0,0,.16)</td></tr><tr><td>Radius</td><td>1rem</td></tr><tr><td>Arrow</td><td>optional · 1.2rem diagonal</td></tr><tr><td>Placement</td><td>top · bottom · left · right + start/end</td></tr><tr><td>Source</td><td>overlays/Popover.ts</td></tr></table></div></body></html>
