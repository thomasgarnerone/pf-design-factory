<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
<title>Type — Titles</title></head>
<body>
<p style="font-size:1.2rem;color:#5C6470;margin-bottom:1.4rem;font-family:'Roboto',sans-serif">
  <b style="color:#23272D">oxygen-font-semantic/title</b> · Montserrat Bold · size / line-height (px)
</p>
<div style="display:flex;flex-direction:column;gap:1.6rem;color:#23272D;font-family:'Montserrat',sans-serif;font-weight:700">
  <div style="display:flex;align-items:baseline;gap:1.6rem">
    <div style="font-size:1.4rem;line-height:2.4rem">Ag Title s-bold</div>
    <span class="mono" style="color:#5C6470">14 / 24</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:1.6rem">
    <div style="font-size:1.8rem;line-height:2.4rem">Ag Title l-bold</div>
    <span class="mono" style="color:#5C6470">18 / 24</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:1.6rem">
    <div style="font-size:2.4rem;line-height:3.2rem">Ag Title xl-bold</div>
    <span class="mono" style="color:#5C6470">24 / 32</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:1.6rem">
    <div style="font-size:3.2rem;line-height:4rem">Ag Title xxl-bold</div>
    <span class="mono" style="color:#5C6470">32 / 40</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:1.6rem">
    <div style="font-size:4rem;line-height:5.6rem">Ag Title xxxl-bold</div>
    <span class="mono" style="color:#5C6470">40 / 56</span>
  </div>
</div>
