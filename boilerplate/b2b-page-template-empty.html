<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oxygen · B2B Page Template (empty)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 62.5%; }
  body {
    font-family: 'Roboto', -apple-system, sans-serif;
    background: var(--oxygen-color-primitive-grey-00);
    color: var(--oxygen-color-primitive-grey-150);
    min-height: 100vh;
  }

  /* ============================================================
   * Page shell — OS Menu (left) + Top Bar (top) + white content
   * ============================================================ */
  .ox-shell {
    --shell-chrome-bg: #00264C;
    display: grid;
    grid-template-columns: 8rem 1fr;
    grid-template-rows: 5.6rem 1fr;
    min-height: 100vh;
    background: var(--shell-chrome-bg);
  }

  /* OS Menu spans both rows on the left */
  .ox-shell > .ox-osmenu {
    grid-column: 1;
    grid-row: 1 / span 2;
  }

  /* Top Bar sits in the top-right cell */
  .ox-shell > .ox-topbar {
    grid-column: 2;
    grid-row: 1;
  }

  /* Content fills the remaining bottom-right cell.
     The 0.8rem inner radius on its top-left corner produces the
     smooth 8px transition between the OS Menu and the Top Bar. */
  .ox-shell__content {
    grid-column: 2;
    grid-row: 2;
    background: #FFFFFF;
    border-top-left-radius: 0.8rem;
    min-width: 0;
    min-height: 0;
  }

  /* ============================================================
   * OS Menu
   * ============================================================ */
  .ox-osmenu {
    --osmenu-bg: #00264C;
    --osmenu-hover: rgba(255, 255, 255, 0.15);
    --osmenu-active: rgba(255, 255, 255, 0.25);
    --osmenu-fg: #FFFFFF;
    --osmenu-badge-bg: #F5B400;
    --osmenu-badge-fg: #00264C;
    --osmenu-new-bg: #F5B400;
    --osmenu-new-fg: #00264C;

    width: 8rem;
    background: var(--osmenu-bg);
    color: var(--osmenu-fg);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 1.2rem 0;
    gap: 0.2rem;
    user-select: none;
    font-family: 'Roboto', sans-serif;
  }
  .ox-osmenu__brand {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 6.4rem;
    margin-bottom: 0.4rem;
    color: var(--osmenu-fg);
  }
  .ox-osmenu__brand svg { width: 2.7rem; height: 3rem; display: block; }

  .ox-osmenu__item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    padding: 1.2rem 0.4rem;
    border: 0;
    background: transparent;
    color: var(--osmenu-fg);
    border-radius: 0;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: background-color 150ms ease-out;
    font-family: inherit;
  }
  .ox-osmenu__item:hover { background: var(--osmenu-hover); }
  .ox-osmenu__item:focus-visible { outline: 0.2rem solid #FFFFFF; outline-offset: -0.2rem; }
  .ox-osmenu__item[aria-current="page"],
  .ox-osmenu__item.is-active { background: var(--osmenu-active); }

  .ox-osmenu__icon {
    width: 2.4rem; height: 2.4rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; line-height: 1; color: var(--osmenu-fg);
  }
  .ox-osmenu__label {
    font-size: 1.1rem; font-weight: 400; line-height: 1.25;
    color: var(--osmenu-fg); text-wrap: balance;
  }
  .ox-osmenu__badge {
    position: absolute; top: 0.6rem; right: 0.8rem;
    min-width: 1.8rem; height: 1.8rem; padding: 0 0.5rem;
    border-radius: 99rem;
    background: var(--osmenu-badge-bg); color: var(--osmenu-badge-fg);
    font-size: 1.1rem; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .ox-osmenu__new {
    position: absolute; top: 0.4rem; right: 0.4rem;
    background: var(--osmenu-new-bg); color: var(--osmenu-new-fg);
    font-size: 1rem; font-weight: 700; line-height: 1;
    padding: 0.3rem 0.6rem; border-radius: 0.4rem; letter-spacing: 0.02em;
  }
  .ox-osmenu__spacer { flex: 1; }
  .ox-osmenu__footer {
    display: flex; flex-direction: column; align-items: center;
    gap: 0.8rem; padding: 1.2rem 0 0.4rem;
  }
  .ox-osmenu__avatar {
    width: 4rem; height: 4rem; border-radius: 99rem;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1.4rem; color: #FFFFFF;
    border: 0.2rem solid var(--osmenu-bg);
    box-shadow: 0 0 0 0.1rem rgba(255,255,255,0.15);
  }
  .ox-osmenu__avatar--user { background: #B45A1A; }
  .ox-osmenu__avatar--more { background: var(--oxygen-color-primitive-blue-107); }

  /* ============================================================
   * Top Bar
   * ============================================================ */
  .ox-topbar {
    --topbar-bg: #00264C;
    --topbar-fg: #FFFFFF;
    --topbar-fg-weak: rgba(255, 255, 255, 0.72);
    --topbar-stroke: rgba(255, 255, 255, 0.24);
    --topbar-stroke-strong: rgba(255, 255, 255, 0.40);
    --topbar-hover: rgba(255, 255, 255, 0.08);
    --topbar-input-bg: rgba(255, 255, 255, 0.06);
    --topbar-badge-bg: #F5B400;
    --topbar-badge-fg: #00264C;

    width: 100%;
    height: 5.6rem;
    background: var(--topbar-bg);
    color: var(--topbar-fg);
    display: flex;
    align-items: center;
    gap: 1.2rem;
    padding: 0 1.6rem;
    font-family: 'Roboto', sans-serif;
  }
  .ox-topbar__search {
    flex: 1 1 auto; min-width: 0; max-width: 56rem;
    height: 4rem; display: flex; align-items: center; gap: 1rem;
    padding: 0 1.4rem;
    background: var(--topbar-input-bg);
    border: 0.1rem solid var(--topbar-stroke);
    border-radius: 0.8rem; color: var(--topbar-fg); cursor: text;
    transition: border-color 150ms ease-out, background-color 150ms ease-out;
  }
  .ox-topbar__search:hover { border-color: var(--topbar-stroke-strong); }
  .ox-topbar__search:focus-within { border-color: #FFFFFF; background: rgba(255, 255, 255, 0.10); }
  .ox-topbar__search i { font-size: 1.4rem; color: var(--topbar-fg-weak); flex: 0 0 auto; }
  .ox-topbar__search input {
    flex: 1 1 auto; min-width: 0; border: 0; outline: 0;
    background: transparent; color: var(--topbar-fg);
    font: inherit; font-size: 1.4rem;
  }
  .ox-topbar__search input::placeholder { color: var(--topbar-fg-weak); }

  .ox-topbar__pill {
    flex: 0 0 auto; height: 4rem;
    display: inline-flex; align-items: center; gap: 0.8rem;
    padding: 0 1.6rem;
    background: transparent; color: var(--topbar-fg);
    border: 0.1rem solid var(--topbar-stroke); border-radius: 99rem;
    font: inherit; font-size: 1.4rem; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background-color 150ms ease-out, border-color 150ms ease-out;
  }
  .ox-topbar__pill:hover { background: var(--topbar-hover); border-color: var(--topbar-stroke-strong); }
  .ox-topbar__pill:focus-visible { outline: 0.2rem solid #FFFFFF; outline-offset: 0.2rem; }
  .ox-topbar__pill i { font-size: 1.4rem; color: var(--topbar-fg); }

  .ox-topbar__group {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .ox-topbar__icon {
    position: relative; width: 4rem; height: 4rem;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--topbar-fg);
    border: 0; border-radius: 99rem; cursor: pointer;
    transition: background-color 150ms ease-out;
  }
  .ox-topbar__icon i { font-size: 1.7rem; line-height: 1; }
  .ox-topbar__icon:hover { background: var(--topbar-hover); }
  .ox-topbar__icon:focus-visible { outline: 0.2rem solid #FFFFFF; outline-offset: -0.2rem; }
  .ox-topbar__icon:disabled { opacity: 0.4; cursor: not-allowed; }
  .ox-topbar__badge {
    position: absolute; top: 0.4rem; right: 0.4rem;
    min-width: 1.6rem; height: 1.6rem; padding: 0 0.4rem;
    border-radius: 99rem;
    background: var(--topbar-badge-bg); color: var(--topbar-badge-fg);
    font-size: 1rem; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
    box-shadow: 0 0 0 0.2rem var(--topbar-bg);
  }
  .ox-topbar__divider {
    width: 0.1rem; align-self: stretch;
    margin: 1.2rem 0.4rem; background: var(--topbar-stroke);
  }
  .ox-topbar__avatar {
    width: 4rem; height: 4rem; border-radius: 99rem;
    border: 0; padding: 0;
    background: #B45A1A; color: #FFFFFF;
    font: inherit; font-weight: 700; font-size: 1.3rem;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
    box-shadow: 0 0 0 0.1rem rgba(255,255,255,0.18);
    transition: box-shadow 150ms ease-out;
  }
  .ox-topbar__avatar:hover { box-shadow: 0 0 0 0.2rem rgba(255,255,255,0.32); }
  .ox-topbar__spacer { flex: 1 1 auto; }
</style>
</head>
<body>

<div class="ox-shell" data-screen-label="B2B Page Template (empty)">

  <!-- ============================================================
       OS Menu (left rail)
       ============================================================ -->
  <nav class="ox-osmenu" aria-label="Primary">
    <div class="ox-osmenu__brand" aria-label="Doctolib">
      <svg viewBox="0 0 27 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M26.383 14.5641C27.1787 10.1879 27.1787 1.54163 13.4401 0.0829107C9.8066 -0.288401 4.18388 0.6664 0.125981 1.3825C0.0729362 1.3825 0.0464139 1.43554 0.0198917 1.48859C-0.00663056 1.54163 -0.00663056 1.67424 0.0198917 1.78033C0.125981 2.0986 0.523814 2.68209 1.00121 2.89427C1.37253 3.07992 2.19472 3.02688 2.3008 3.02688C14.8458 1.91295 23.8103 4.64474 22.1925 13.8214C21.2377 19.1259 17.7633 25.7299 8.18874 25.7299C6.25262 25.7299 6.01392 25.5708 6.25262 24.006C6.27914 23.7938 9.24963 7.93349 9.43529 6.34216C9.43529 6.28911 9.40877 6.23607 9.35572 6.20955C9.24963 6.20955 7.15438 5.70562 6.65045 7.72131C6.54436 8.14567 1.50514 26.9234 1.26644 27.9047C0.94817 29.2839 1.87645 30 8.02961 30C23.5982 29.9735 25.9321 17.1367 26.383 14.5641Z" fill="currentColor"/>
      </svg>
    </div>

    <button type="button" class="ox-osmenu__item is-active" aria-current="page">
      <span class="ox-osmenu__icon"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Calendar</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__icon"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Tasks</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__new">New</span>
      <span class="ox-osmenu__icon"><i class="fa-solid fa-comment-medical" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Connect (Tele-expertise)</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__badge" aria-label="2 unread">2</span>
      <span class="ox-osmenu__icon"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Patient Messaging</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__icon"><i class="fa-solid fa-folder-open" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Patient Management</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__icon"><i class="fa-solid fa-envelope" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Emails</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__badge" aria-label="2 to review">2</span>
      <span class="ox-osmenu__icon"><i class="fa-solid fa-file-import" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Import of documents</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__icon"><i class="fa-solid fa-euro-sign" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">Billing</span>
    </button>
    <button type="button" class="ox-osmenu__item">
      <span class="ox-osmenu__icon"><i class="fa-solid fa-chart-line" aria-hidden="true"></i></span>
      <span class="ox-osmenu__label">My activity</span>
    </button>

    <span class="ox-osmenu__spacer" aria-hidden="true"></span>

    <div class="ox-osmenu__footer">
      <span class="ox-osmenu__avatar ox-osmenu__avatar--user" aria-label="Bryan Joubert">BJ</span>
      <span class="ox-osmenu__avatar ox-osmenu__avatar--more" aria-label="37 more users">+37</span>
    </div>
  </nav>

  <!-- ============================================================
       Top Bar (top)
       ============================================================ -->
  <header class="ox-topbar" role="banner">
    <label class="ox-topbar__search" aria-label="Search for a patient">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="search" placeholder="Search for a patient">
    </label>

    <button type="button" class="ox-topbar__pill">
      <i class="fa-regular fa-id-card" aria-hidden="true"></i>
      <span>Insurance card</span>
    </button>

    <div class="ox-topbar__group" role="group" aria-label="Telehealth">
      <button type="button" class="ox-topbar__icon" aria-label="Video consultation, 1 pending">
        <i class="fa-solid fa-video" aria-hidden="true"></i>
        <span class="ox-topbar__badge" aria-hidden="true">1</span>
      </button>
      <button type="button" class="ox-topbar__icon" aria-label="Audio levels">
        <i class="fa-solid fa-wave-square" aria-hidden="true"></i>
      </button>
      <span class="ox-topbar__divider" aria-hidden="true"></span>
      <button type="button" class="ox-topbar__icon" aria-label="Microphone">
        <i class="fa-solid fa-microphone" aria-hidden="true"></i>
      </button>
    </div>

    <span class="ox-topbar__spacer" aria-hidden="true"></span>

    <button type="button" class="ox-topbar__pill">
      <i class="fa-regular fa-circle-question" aria-hidden="true"></i>
      <span>Help and contact</span>
    </button>

    <div class="ox-topbar__group" role="group" aria-label="System">
      <button type="button" class="ox-topbar__icon" aria-label="Announcements">
        <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>
      </button>
      <button type="button" class="ox-topbar__icon" aria-label="Team">
        <i class="fa-solid fa-user-group" aria-hidden="true"></i>
      </button>
      <button type="button" class="ox-topbar__icon" aria-label="Lock session">
        <i class="fa-solid fa-lock" aria-hidden="true"></i>
      </button>
      <button type="button" class="ox-topbar__icon" aria-label="Settings">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      </button>
    </div>

    <button type="button" class="ox-topbar__avatar" aria-label="Account: Bryan Joubert">BJ</button>
  </header>

  <!-- ============================================================
       Empty white content area — 8px top-left radius creates the
       smooth corner between OS Menu and Top Bar
       ============================================================ -->
  <main class="ox-shell__content" aria-label="Page content"></main>

</div>

</body>
</html>
