<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Spacing — 8pt scale</title></head>
<body>
<p style="font-size:1.3rem;color:#5C6470;margin-bottom:1rem">gridUnit · 1 unit = 0.8rem = 8px</p>
<div style="display:flex;flex-direction:column;gap:0.6rem">
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x0.25</span><div style="height:1rem;width:0.2rem;background:#107ACA"></div><span class="mono">2px · 0.2rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x0.5</span><div style="height:1rem;width:0.4rem;background:#107ACA"></div><span class="mono">4px · 0.4rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x1</span><div style="height:1rem;width:0.8rem;background:#107ACA"></div><span class="mono">8px · 0.8rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x1.5</span><div style="height:1rem;width:1.2rem;background:#107ACA"></div><span class="mono">12px · 1.2rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x2</span><div style="height:1rem;width:1.6rem;background:#107ACA"></div><span class="mono">16px · 1.6rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x3</span><div style="height:1rem;width:2.4rem;background:#107ACA"></div><span class="mono">24px · 2.4rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x4</span><div style="height:1rem;width:3.2rem;background:#107ACA"></div><span class="mono">32px · 3.2rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x6</span><div style="height:1rem;width:4.8rem;background:#107ACA"></div><span class="mono">48px · 4.8rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x8</span><div style="height:1rem;width:6.4rem;background:#107ACA"></div><span class="mono">64px · 6.4rem</span></div>
  <div style="display:flex;align-items:center;gap:1.2rem"><span class="mono" style="width:8rem">x10</span><div style="height:1rem;width:8rem;background:#107ACA"></div><span class="mono">80px · 8rem</span></div>
</div>
</body></html>
